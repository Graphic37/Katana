const SFX={
  buffers:{}, ctx:null, master:null, enabled:true, ready:false,
  groups:{
    swing:['swing1','swing2'],
    hit:['hit1','hit2','hit3'],
    heavy:['heavy1','heavy2'],
    grunt:['grunt1','grunt2','grunt3'],
    enemyhurt:['enemyhurt1','enemyhurt2','enemyhurt3']
  },
  async init(){
    if(this.ctx)return;
    this.ctx=new (window.AudioContext||window.webkitAudioContext)();
    this.master=this.ctx.createGain();this.master.gain.value=0.55;this.master.connect(this.ctx.destination);
    // decode all
    const keys=Object.keys(SFX_DATA);
    await Promise.all(keys.map(async k=>{
      try{
        const res=await fetch(SFX_DATA[k]);
        const arr=await res.arrayBuffer();
        this.buffers[k]=await this.ctx.decodeAudioData(arr);
      }catch(e){console.warn('sfx decode fail',k,e);}
    }));
    this.ready=true;
  },
  play(group,{vol=1,rate=1,vary=0.08}={}){
    if(!this.enabled||!this.ready||!this.ctx)return;
    const list=this.groups[group];if(!list)return;
    const key=list[Math.floor(Math.random()*list.length)];
    const buf=this.buffers[key];if(!buf)return;
    const src=this.ctx.createBufferSource();src.buffer=buf;
    src.playbackRate.value=rate*(1+(Math.random()*2-1)*vary);
    const g=this.ctx.createGain();g.gain.value=vol;
    src.connect(g);g.connect(this.master);
    src.start(0);
  },
  toggle(){this.enabled=!this.enabled;return this.enabled;}
};

// ---- terrain: large rolling grass field ----
const SIZE=176, SEG=200;
const gGeo=new THREE.PlaneGeometry(SIZE,SIZE,SEG,SEG);
function terrainH(x,z){
  const base = Math.sin(x*0.06)*Math.cos(z*0.05)*2.2
       + Math.sin(x*0.13+1.7)*Math.cos(z*0.11)*0.9
       - (Math.hypot(x,z)*0.02);            // gentle bowl toward centre
  // flatten a disc under the spawn plaza so the stone floor sits flush (no green rim)
  const d=Math.hypot(x,z);
  const FLAT_R=8.0, BLEND=3.0;
  const centerH=0.892;                      // base height at (0,0)
  if(d<FLAT_R) return centerH;
  if(d<FLAT_R+BLEND){
    const t=(d-FLAT_R)/BLEND;               // 0..1 blend out to natural terrain
    return centerH*(1-t)+base*t;
  }
  return base;
}
const PLAZA_H=0.892;
const gp=gGeo.attributes.position;
for(let i=0;i<gp.count;i++){
  const x=gp.getX(i), y=gp.getY(i);
  gp.setZ(i, terrainH(x,-y));
}
gGeo.computeVertexNormals();

const texLoader=new THREE.TextureLoader();texLoader.setCrossOrigin('anonymous');
// NOTE: the kit's Grass.png is a sprite atlas (mostly pale cream), NOT a tileable
// ground texture — tiling it washes the field to near-white. The kit ships no
// terrain texture, so the ground is solid grass-green and the kit's grass *tufts*
// (which sample the green blades from that atlas) supply all the grassy detail.
// Floor is dark soil — it should barely show; the grass carpet is the surface.
const ground=new THREE.Mesh(gGeo,new THREE.MeshStandardMaterial({color:0x3c5a2e,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;
scene.add(ground);
const H=(x,z)=>terrainH(x,z);

skirt.position.y=-3;scene.add(skirt);

// ---- loader plumbing ----
const loader=new THREE.GLTFLoader();
const cache={};
function load(name){return cache[name]||(cache[name]=new Promise((res,rej)=>{
  loader.load(BASE+name+".gltf",g=>{
    g.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;
      if(o.material){o.material.roughness=0.95;o.material.metalness=0;}}});
    res(g.scene);
  },undefined,rej);
}));}

let queued=0, done=0;
const fill=document.getElementById('fill');
const all=[];
function track(p){queued++;all.push(p);p.then(()=>{done++;fill.style.width=(done/queued*100)+'%';});return p;}

// ---- OBSTACLES: solid props the hero/enemies can't walk through ----
const OBSTACLES=[];   // {x,z,r}
// which prop names are solid, and their collision radius (world units, pre-scale baseline)
const SOLID_PROPS={
  CommonTree:1.1, Pine:1.0, DeadTree:1.2, Rock_Medium:1.4, Rock_Large:1.8
};
function obstacleRadiusFor(name,s){
  for(const key in SOLID_PROPS){
    if(name.indexOf(key)===0) return SOLID_PROPS[key]*s;
  }
  return 0; // not solid (flowers, bushes, mushrooms, pebbles, ferns, paths)
}
// push a circle (entity radius er at x,z) out of any overlapping obstacle. Returns {x,z}.
// Uses a spatial grid so each entity only checks nearby obstacles (stays fast with many trees).
const OBS_CELL=10;            // grid cell size in world units
const obsGrid=new Map();
function obsKey(cx,cz){return cx+','+cz;}
function buildObstacleGrid(){
  obsGrid.clear();
  for(let i=0;i<OBSTACLES.length;i++){
    const o=OBSTACLES[i];
    const cx=Math.floor(o.x/OBS_CELL), cz=Math.floor(o.z/OBS_CELL);
    const k=obsKey(cx,cz);
    if(!obsGrid.has(k))obsGrid.set(k,[]);
    obsGrid.get(k).push(o);
  }
}
function resolveObstacle(x,z,er){
  const cx=Math.floor(x/OBS_CELL), cz=Math.floor(z/OBS_CELL);
  for(let gx=cx-1;gx<=cx+1;gx++)for(let gz=cz-1;gz<=cz+1;gz++){
    const cell=obsGrid.get(obsKey(gx,gz));
    if(!cell)continue;
    for(let i=0;i<cell.length;i++){
      const o=cell[i];
      const dx=x-o.x, dz=z-o.z;
      const minD=o.r+er;
      const d2=dx*dx+dz*dz;
      if(d2<minD*minD && d2>1e-6){
        const d=Math.sqrt(d2);
        const push=(minD-d);
        x+=(dx/d)*push; z+=(dz/d)*push;
      }
    }
  }
  return {x,z};
}
function place(name,x,z,{s=1,ry=null,tilt=0,yoff=0}={}){
  const or=obstacleRadiusFor(name,s);
  if(or>0)OBSTACLES.push({x,z,r:or});
  return track(load(name).then(proto=>{
    const m=proto.clone(true);
    m.scale.setScalar(s);
    m.position.set(x,H(x,z)+yoff,z);
    m.rotation.y=ry==null?Math.random()*Math.PI*2:ry;
    if(tilt)m.rotation.z=(Math.random()-.5)*tilt;
    scene.add(m);
    return m;
  }).catch(()=>{}));
}

// pull the first mesh's geometry+material out of a loaded tuft
function firstMesh(root){let f=null;root.traverse(o=>{if(!f&&o.isMesh)f=o;});return f;}

// ---------- WIND (GPU vertex sway) ----------
const WIND = {
  uTime:   { value: 0 },
  strength:{ value: 0.18 },   // how far the tips lean (world units-ish)
  speed:   { value: 1.6 },    // gust frequency
  scale:   { value: 0.06 }    // spatial variation across the field
};
// Inject height-weighted sway into any grass material. GPU-only, ~free.
function applyWind(mat){
  mat.onBeforeCompile = (shader)=>{
    shader.uniforms.uTime     = WIND.uTime;
    shader.uniforms.uStrength = WIND.strength;
    shader.uniforms.uSpeed    = WIND.speed;
    shader.uniforms.uScale    = WIND.scale;
    shader.vertexShader =
      "uniform float uTime;uniform float uStrength;uniform float uSpeed;uniform float uScale;\n"
      + shader.vertexShader.replace(
        "#include <begin_vertex>",
        `#include <begin_vertex>
        // instance world position (column 3 of the instance matrix)
        vec3 iPos = vec3(instanceMatrix[3][0],instanceMatrix[3][1],instanceMatrix[3][2]);
        // height weight: 0 at root, 1 at tip (object-space Y, tufts ~1.3 tall)
        float h = clamp(position.y / 1.3, 0.0, 1.0);
        float ph = (iPos.x + iPos.z) * uScale;
        float sway = sin(uTime * uSpeed + ph) + 0.4 * sin(uTime * uSpeed * 2.3 + ph * 1.7);
        transformed.x += sway * uStrength * h * h;
        transformed.z += cos(uTime * uSpeed * 0.8 + ph) * uStrength * 0.5 * h * h;`
      );
  };
  mat.needsUpdate = true;
}

// Carpet the whole field with one InstancedMesh per grass type. Tens of
// thousands of real kit tufts ARE the floor — no green plane showing through.
function grassCarpet(names,perType,radius,density){
  return track(Promise.all(names.map(load)).then(roots=>{
    const dummy=new THREE.Object3D();
    roots.forEach((root,gi)=>{
      const src=firstMesh(root); if(!src)return;
      const geo=src.geometry, mat=src.material.clone();
      mat.side=THREE.DoubleSide;
      applyWind(mat);
      const inst=new THREE.InstancedMesh(geo,mat,perType);
      inst.castShadow=true; inst.receiveShadow=true;
      let k=0;
      while(k<perType){
        const x=(Math.random()*2-1)*radius;
        const z=(Math.random()*2-1)*radius;
        if(Math.hypot(x,z)>radius) continue;          // circular field
        if(Math.hypot(x,z)<SPAWN_R+0.3) continue;     // keep the spawn plaza clear
        dummy.position.set(x,H(x,z)-0.05,z);
        dummy.rotation.set(0,Math.random()*Math.PI*2,(Math.random()-.5)*0.25);
        const s=density*(0.7+Math.random()*0.7);
        dummy.scale.setScalar(s);
        dummy.updateMatrix();

const PATH=["RockPath_Round_Wide","RockPath_Square_Wide"];
function pathTile(x,z,ry){
  const n=PATH[Math.floor(Math.random()*PATH.length)];
  place(n,x,z,{s:1.15,yoff:-0.04,ry:ry+(Math.random()-.5)*0.2});

// Lay a path as a 2-tile-wide band of stone along a curve. fn(t)->[x,z].
function pathAlong(fn,steps,width=2){
  let prev=null;
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const [x,z]=fn(t);
    const [x2,z2]=fn(Math.min(1,t+0.01));
    const dx=x2-x, dz=z2-z, len=Math.hypot(dx,dz)||1;
    const nx=-dz/len, nz=dx/len;            // perpendicular (path normal)
    const heading=Math.atan2(dx,dz);
    if(!prev || Math.hypot(x-prev[0],z-prev[1])>1.8){
      for(let w=-(width-1)/2; w<=(width-1)/2; w++){
        pathTile(x+nx*w*1.9, z+nz*w*1.9, heading);
      }
      prev=[x,z];
    }
  }
}

async function hEnsure(name){
  if(hClipCache[name])return hClipCache[name];
  const e=hManifest.clips.find(c=>c.name===name);if(!e)return null;
  const g=await fetchGLB(KATANA_BASE+e.file);
  let clip=g.animations[0];
  // strip the root POSITION track so baked root motion doesn't fight our procedural movement
  // (we drive the hero's world position ourselves). Keep root rotation.
  if(clip&&clip.tracks){
    clip.tracks=clip.tracks.filter(tr=>!(tr.name==='root.position'||tr.name.endsWith('root.position')));
  }
  hClipCache[name]=clip;return clip;
}
async function hPlay(name,{loop=true,fade=0.2,onDone=null,speed=1}={}){
  const clip=await hEnsure(name);if(!clip)return;
  if(hCurrent)hCurrent.fadeOut(fade);

  act.setEffectiveTimeScale(speed);

  act.fadeIn(fade).play();hCurrent=act;hCurrentName=name;
  if(onDone){const h=e=>{if(e.action===act){hmixer.removeEventListener('finished',h);onDone();}};hmixer.addEventListener('finished',h);}
  return act;
}

// =================== ATTACK-MOVE SYSTEM ===================
// Hold right-click: lunge toward the best enemy under the cursor and attack,
// chaining strikes and sticking to the target. (mechanic-first, plain attacks)
let rmbHeld=false, lmbHeld=false;
let comboStep=0,comboTimer=0,rootMotion=null,lockedTarget=null,comboReleaseTimer=null;
let attackQueued=false, lunge=null, slideToward=null, hitDealtThisSwing=false;

const ACQUIRE_RANGE=22;        // max distance we'll look for a target under cursor
const MELEE_RANGE=6.5;         // inside this = can hit
const CONE_DOT=0.3;            // how wide the cursor cone is (lower = wider)
const LUNGE_SPEED=42;          // very fast dash into range
const COMBO_DMG=45;
const ATK_SPEED=1.7;           // attack animation playback speed (snappy)

// pick the enemy that best matches "where the cursor points", within a cone
function acquireUnderCursor(){
  if(!hero)return null;
  const cdx=cursorWorld.x-hero.position.x, cdz=cursorWorld.z-hero.position.z;
  const clen=Math.hypot(cdx,cdz)||1;
  const cnx=cdx/clen, cnz=cdz/clen;   // cursor direction from player
  let best=null,bestScore=-Infinity;
  for(const e of enemies){
    if(e.dead)continue;
    const ex=e.group.position.x-hero.position.x, ez=e.group.position.z-hero.position.z;
    const ed=Math.hypot(ex,ez);
    if(ed>ACQUIRE_RANGE)continue;
    const enx=ex/(ed||1), enz=ez/(ed||1);
    const dot=cnx*enx+cnz*enz;          // alignment with cursor direction
    if(dot<CONE_DOT && ed>MELEE_RANGE)continue; // outside cone and not already adjacent
    // also weight by closeness to the cursor's WORLD point (prioritize enemy near cursor)
    const distToCursor=Math.hypot(e.group.position.x-cursorWorld.x,e.group.position.z-cursorWorld.z);
    const score=dot*4 - distToCursor*0.5 - ed*0.05;
    if(score>bestScore){bestScore=score;best=e;}
  }
  return best;
}

function faceTarget(e){
  heroFacing=Math.atan2(e.group.position.x-hero.position.x, e.group.position.z-hero.position.z);
}
function faceCursor(){
  heroFacing=Math.atan2(cursorWorld.x-hero.position.x, cursorWorld.z-hero.position.z);
}
function distTo(e){return Math.hypot(e.group.position.x-hero.position.x,e.group.position.z-hero.position.z);}

// (damageTarget / damageAoE defined in the enemy system section below)

// begin one strike of the attack-move chain
function startAttackSwing(){
  if(!heroReady||hLocked)return;
  const target=acquireUnderCursor();
  lockedTarget=target;
  hLocked=true;moveTarget=null;hitDealtThisSwing=false;
  if(target){
    faceTarget(target);
    const d=distTo(target);
    if(d>MELEE_RANGE){
      // fast lunge into range, blended with the attack (one continuous action)
      const dir=new THREE.Vector3(target.group.position.x-hero.position.x,0,target.group.position.z-hero.position.z).normalize();
      const dist=Math.min(d-MELEE_RANGE*0.6, ACQUIRE_RANGE);
      lunge={dir,remaining:dist};
    }else{lunge=null;}
    slideToward=target; // keep stepping toward it during the swing
  }else{
    faceCursor();         // no enemy: swing toward cursor, no map-running
    lunge=null;slideToward=null;
  }
  const name=HSTATE.combo[comboStep];
  SFX.play('swing',{vol:0.5,rate:1.1});       // swing whoosh
  if(Math.random()<0.35)SFX.play('grunt',{vol:0.4}); // occasional effort grunt
  // damage lands partway through the swing (committed hit frame approximation)
  setTimeout(()=>{
    const fx=hero.position.x+Math.sin(hero.rotation.y)*3;
    const fz=hero.position.z+Math.cos(hero.rotation.y)*3;
    const hits=damageAoE(COMBO_DMG, MELEE_RANGE+2.5, fx, fz);
    hitDealtThisSwing=true;
  },90);
  // FLUID COMBO: release early so the next swing blends in seamlessly (no full reset/stutter)
  const clip=hClipCache[name];
  const cdur=clip?clip.duration:0.6;
  const playDur=cdur/ATK_SPEED;
  const release=playDur*0.55;     // hand off to next swing at ~55% — overlapping, continuous
  if(comboReleaseTimer)clearTimeout(comboReleaseTimer);
  comboReleaseTimer=setTimeout(()=>{
    hLocked=false;lunge=null;slideToward=null;
    comboStep=(comboStep+1)%3;comboTimer=0.6;
  },release*1000);
  hPlay(name,{loop:false,fade:0.12,speed:ATK_SPEED});
}

// ===== GRAB & SLAM (Skill_D) =====
// Lunge to target, grab on initial hit, carry them up through the leap arc, slam down.
let slam=null; // active slam state
let dodge=null; // active dodge state
let heroIFrames=0; // invulnerability timer

// ===== DODGE ROLL =====
function doDodge(){
  if(!heroReady||hLocked||dodge)return;
  let dx,dz;
  if(moveTarget){
    dx=moveTarget.x-hero.position.x; dz=moveTarget.z-hero.position.z;
  }else{
    dx=Math.sin(hero.rotation.y); dz=Math.cos(hero.rotation.y);
  }
  const len=Math.hypot(dx,dz)||1; dx/=len; dz/=len;
  hero.rotation.y=Math.atan2(dx,dz);
  hLocked=true;moveTarget=null;
  heroIFrames=0.5;
  dodge={dx,dz,dist:11.0,dur:0.42,elapsed:0,applied:0};   // big snappy roll
  hPlay(HSTATE.dodgeF,{loop:false,fade:0.05,speed:1.9});
  if(window._dodgeTimer)clearTimeout(window._dodgeTimer);
  window._dodgeTimer=setTimeout(()=>{hLocked=false;dodge=null;},460);
  if(typeof spawnShockwave==='function')spawnShockwave(hero.position.x,hero.position.z,0xcfcfcf,3,0.3);
  SFX.play('swing',{vol:0.4,rate:1.3});  // quick dodge whoosh
}
function updateDodge(dt){
  if(!dodge)return;
  dodge.elapsed+=dt;
  const t=Math.min(1,dodge.elapsed/dodge.dur);
  const eased=1-Math.pow(1-t,2);          // fast start, ease out
  const want=dodge.dist*eased;
  const step=want-dodge.applied;
  hero.position.x+=dodge.dx*step;
  hero.position.z+=dodge.dz*step;
  dodge.applied=want;
  if(t>=1)dodge=null;
}

// ===== AUTO-IDLER AI =====
window.autoPlay=false;
let autoSkillCD=0, autoRepathT=0, autoSkillIdx=0;
const AUTO_SKILLS=['Digit4','Digit6','Digit5','Digit1','Digit3'];
function nearestLivePack(){
  let best=null,bd=1e9;
  for(const pack of packs){
    if(!packMemberAlive(pack))continue;
    let lx=0,lz=0,n=0;
    for(const m of pack.members){if(!m.dead){lx+=m.x;lz+=m.z;n++;}}
    if(!n)continue; lx/=n;lz/=n;
    const d=Math.hypot(lx-hero.position.x,lz-hero.position.z);
    if(d<bd){bd=d;best={pack,cx:lx,cz:lz,d};}
  }
  return best;
}
function autoIdlerTick(dt){
  autoSkillCD-=dt; autoRepathT-=dt;
  const near=nearestEnemy(60);
  const inFight = near && near.d<MELEE_RANGE+5;
  if(inFight){
    faceTarget(near.e);
    moveTarget=null;
    if(autoSkillCD<=0){
      // SKILL IS PRIORITY — cast next in rotation the moment it's ready
      castSkillByKey(AUTO_SKILLS[autoSkillIdx++%AUTO_SKILLS.length]);
      autoSkillCD=0.7+Math.random()*0.2;   // next skill in ~0.8s
    }else if(autoSkillCD>0.45){
      // basic-swing only while the next skill is still a bit away,
      // so a basic attack's lock never overlaps the skill-ready moment
      startAttackSwing();
    }
    // (when 0 < autoSkillCD <= 0.45: do nothing, let the skill fire cleanly next tick)
  }else{
    const pk=nearestLivePack();
    if(pk){
      if(autoRepathT<=0){moveTarget=new THREE.Vector3(pk.cx,0,pk.cz);autoRepathT=0.3;}
    }else if(autoRepathT<=0){
      moveTarget=new THREE.Vector3((Math.random()-0.5)*60,0,(Math.random()-0.5)*60);autoRepathT=2.5;
    }
  }
}
function castSkillByKey(code){
  if(code==='Digit1')doSpecial(HSTATE.upper,90,0);
  else if(code==='Digit3')doSpecial(HSTATE.jumpAtk,100,2.0);
  else if(code==='Digit4')doSpecial(HSTATE.dashStrike,70,9.0);
  else if(code==='Digit5')doSpecial(HSTATE.spinSlash,85,0,true);
  else if(code==='Digit6')doChargeCarry();
}

function doGrabSlam(){
  if(!heroReady||hLocked)return;
  hLocked=true;moveTarget=null;comboStep=0;
  const target=acquireUnderCursor();
  lockedTarget=target;
  if(target)faceTarget(target);else faceCursor();
  // start the skill animation (root-stripped feel: we drive position ourselves)
  hPlay(HSTATE.skill,{loop:false,fade:0.08,speed:1.3,onDone:()=>{
    hLocked=false;slam=null;
  }});
  const dur=2.17/1.3; // clip duration / playback speed
  const dir=new THREE.Vector3(Math.sin(hero.rotation.y),0,Math.cos(hero.rotation.y));
  const startPos=hero.position.clone();
  slam={
    target, dir, startPos, elapsed:0, dur,
    grabbed:false, grabbedAt:null, dmgDone:false,
    enemyStartY:target?target.group.position.y:0
  };
  // initial contact damage early in the leap
  setTimeout(()=>{ if(target&&!target.dead){applyEnemyDamage(target,40); if(slam)slam.grabbed=true;} },140);
}
function updateSlam(dt){
  if(!slam)return;
  slam.elapsed+=dt;
  const t=Math.min(1,slam.elapsed/slam.dur);
  // leap arc (matches Skill_D curve): forward + up then down
  // horizontal progress: ease forward to ~3.2 units
  const fwd=3.2*Math.min(1, t*1.4);
  // vertical: rises to peak ~ t=0.45, slams down by t=0.62
  let y;
  if(t<0.45) y=Math.sin(t/0.45*Math.PI*0.5)*2.4;        // rise
  else if(t<0.62) y=Math.cos((t-0.45)/0.17*Math.PI*0.5)*2.4; // slam down
  else y=0;
  const px=slam.startPos.x+slam.dir.x*fwd;
  const pz=slam.startPos.z+slam.dir.z*fwd;
  hero.position.x=px; hero.position.z=pz;
  const groundY=H(px,pz);
  hero.position.y=groundY+y;
  // carry the grabbed enemy with the hero — held in front on the blade
  if(slam.grabbed&&slam.target&&!slam.target.dead){
    const e=slam.target;
    // position in front of hero using CURRENT facing, at blade height
    const fwd=new THREE.Vector3(Math.sin(hero.rotation.y),0,Math.cos(hero.rotation.y));
    const holdDist=2.2;
    e.x=hero.position.x+fwd.x*holdDist;
    e.z=hero.position.z+fwd.z*holdDist;
    e.group.position.x=e.x;
    e.group.position.z=e.z;
    // ride at the hero's height plus blade lift while airborne
    e.group.position.y=hero.position.y + (y>0.1?1.2:0.2);
    e.group.rotation.y=hero.rotation.y+Math.PI; // face the hero (impaled)
    // the SLAM
    if(t>=0.62 && !slam.dmgDone){
      slam.dmgDone=true;
      // SLAM impact: AoE damage to everything around the landing
      damageAoE(120, 9, hero.position.x, hero.position.z);
      spawnShockwave(hero.position.x,hero.position.z,0xffaa44,11,0.55);
      if(typeof SFX!=='undefined')SFX.play('heavy',{vol:0.75,rate:0.85}); // big slam impact
      spawnShockwave(hero.position.x,hero.position.z,0xffffff,7,0.4);
      spawnSparks(hero.position.x,H(hero.position.x,hero.position.z)+0.5,hero.position.z,0xffc060,16);
      e.hitFlash=0.25;
      e.group.position.y=H(e.x,e.z);
    }
  }
}
// ===== CHARGE & CARRY (Skill 6) — charge forward, scoop enemies onto blade, slam =====
let charge=null;
function doChargeCarry(){
  if(!heroReady||hLocked)return;
  hLocked=true;moveTarget=null;comboStep=0;
  // aim: nearest enemy in auto-play, else cursor
  let target = window.autoPlay ? (nearestEnemy(60)||{}).e : acquireUnderCursor();
  if(target)faceTarget(target);else if(!window.autoPlay)faceCursor();
  SFX.play('swing',{vol:0.6,rate:0.85});
  SFX.play('grunt',{vol:0.6});
  const dir=new THREE.Vector3(Math.sin(hero.rotation.y),0,Math.cos(hero.rotation.y));
  hPlay(HSTATE.bigLunge,{loop:false,fade:0.08,speed:1.4});
  charge={
    dir, startPos:hero.position.clone(),
    elapsed:0, dur:2.08/1.4,
    chargeDist:14, carried:[], slammed:false
  };
  if(window._chargeTimer)clearTimeout(window._chargeTimer);
  window._chargeTimer=setTimeout(()=>{hLocked=false;charge=null;},(2.08/1.4)*1000);
}
function updateCharge(dt){
  if(!charge)return;
  charge.elapsed+=dt;
  const t=Math.min(1,charge.elapsed/charge.dur);
  // charge forward during first 60%, then the slam
  const chargePhase=Math.min(1, t/0.6);
  const fwd=charge.chargeDist*(1-Math.pow(1-chargePhase,2)); // ease-out forward
  const px=charge.startPos.x+charge.dir.x*fwd;
  const pz=charge.startPos.z+charge.dir.z*fwd;
  hero.position.x=px; hero.position.z=pz;
  hero.position.y=H(px,pz);
  // scoop up enemies the hero passes through (while charging)
  if(t<0.6){
    for(const e of enemies){
      if(e.dead||charge.carried.includes(e))continue;
      const d=Math.hypot(e.x-px,e.z-pz);
      if(d<3.5){
        charge.carried.push(e);
        applyEnemyDamage(e,30);          // scoop damage
      }
    }
  }
  // carry the scooped enemies stacked in front on the blade
  const fdir=new THREE.Vector3(Math.sin(hero.rotation.y),0,Math.cos(hero.rotation.y));
  charge.carried.forEach((e,i)=>{
    if(e.dead)return;
    const hold=2.2+i*0.9;               // stack them along the blade
    e.x=px+fdir.x*hold; e.z=pz+fdir.z*hold;
    e.group.position.set(e.x, H(e.x,e.z)+1.0, e.z);
    e.group.rotation.y=hero.rotation.y+Math.PI;
  });
  // SLAM at the end
  if(t>=0.62 && !charge.slammed){
    charge.slammed=true;
    const cx=px+fdir.x*2, cz=pz+fdir.z*2;
    damageAoE(130, 10, cx, cz);
    spawnShockwave(cx,cz,0xffaa44,12,0.55);
    spawnShockwave(cx,cz,0xffffff,7,0.4);
    spawnSparks(cx,H(cx,cz)+0.5,cz,0xffc060,18);
    if(typeof SFX!=='undefined')SFX.play('heavy',{vol:0.8,rate:0.8});
    charge.carried.forEach(e=>{if(!e.dead){e.hitFlash=0.25;e.group.position.y=H(e.x,e.z);}});
  }
}

function doSpecial(name,dmg,travel,radial){
  if(!heroReady||hLocked)return;
  hLocked=true;moveTarget=null;comboStep=0;
  SFX.play('swing',{vol:0.6,rate:0.9});      // bigger swing
  SFX.play('grunt',{vol:0.55});              // effort grunt on skills
  // auto-play targets nearest enemy; manual play uses cursor
  let target = window.autoPlay ? (nearestEnemy(60)||{}).e : acquireUnderCursor();
  lockedTarget=target;
  if(target)faceTarget(target);else if(!window.autoPlay)faceCursor();
  setTimeout(()=>{
    if(radial){
      damageAoE(dmg||80, MELEE_RANGE+4, hero.position.x, hero.position.z); // 360° around hero
      spawnShockwave(hero.position.x,hero.position.z,0x66ccff,MELEE_RANGE+4,0.45);
    }else{
      const fx=hero.position.x+Math.sin(hero.rotation.y)*2.5;
      const fz=hero.position.z+Math.cos(hero.rotation.y)*2.5;
      const hits=damageAoE(dmg||80, MELEE_RANGE+3, fx, fz);
      if((dmg||80)>=120) spawnShockwave(fx,fz,0xffaa44,MELEE_RANGE+3,0.4);
    }
  },220);
  if(travel&&travel>0){
    const clip=hClipCache[name];const dur=clip?clip.duration:1.0;
    let actualTravel=travel;
    if(target){actualTravel=Math.max(0,Math.min(travel,distTo(target)-MELEE_RANGE*0.55));}
    if(actualTravel>0.05){
      const dir=new THREE.Vector3(Math.sin(hero.rotation.y),0,Math.cos(hero.rotation.y));
      rootMotion={dir,total:actualTravel,dur,elapsed:0,lastApplied:0};
    }else rootMotion=null;
  }else rootMotion=null;
  // play the clip, but release the lock EARLY (before recovery frames) so abilities chain
  const clip=hClipCache[name];const cdur=clip?clip.duration:1.0;
  const playDur=cdur/1.5;                    // actual play time at speed 1.5
  const earlyRelease=playDur*0.62;           // free up at ~62% — skip the long recovery
  if(window._abilityTimer)clearTimeout(window._abilityTimer);
  window._abilityTimer=setTimeout(()=>{ hLocked=false; rootMotion=null; },earlyRelease*1000);
  hPlay(name,{loop:false,fade:0.06,speed:1.5,onDone:()=>{hLocked=false;rootMotion=null;}});
}

function updateHero(dt){
  if(!heroReady)return;
  if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0)comboStep=0;}

  // ===== AUTO-IDLER: hero finds packs, runs in, casts skills automatically =====
  if(window.autoPlay && !hLocked){ autoIdlerTick(dt); }

  // ===== attack-move: while holding RMB, keep requesting swings =====
  if(rmbHeld && !hLocked){
    startAttackSwing();
  }
  // ===== hold LMB: keep following the cursor =====
  if(lmbHeld && !rmbHeld && !hLocked){
    setMoveTargetToCursor();
  }

  // fast lunge into range (runs during the committed swing)
  if(hLocked&&lunge&&lunge.remaining>0){
    const step=Math.min(lunge.remaining, LUNGE_SPEED*dt);
    hero.position.x+=lunge.dir.x*step;
    hero.position.z+=lunge.dir.z*step;
    lunge.remaining-=step;
  }
  // slight slide toward target during swing so hits stay connected (never bulldoze)
  if(hLocked&&slideToward&&!slideToward.dead){
    const d=distTo(slideToward);
    // never slide closer than the collision distance (hero radius + enemy radius)
    const stopDist=HERO_RADIUS + (slideToward.radius||1.5) + 0.3;
    if(d>stopDist){
      const dir=new THREE.Vector3(slideToward.group.position.x-hero.position.x,0,slideToward.group.position.z-hero.position.z).normalize();
      const step=Math.min(d-stopDist, 8*dt); // gentle, stops at collision edge
      if(step>0){hero.position.x+=dir.x*step;hero.position.z+=dir.z*step;}
    }
    faceTarget(slideToward);
  }

  // apply root-motion travel during special attacks
  if(hLocked&&rootMotion){
    const rm=rootMotion;rm.elapsed+=dt;
    const frac=Math.min(1,rm.elapsed/rm.dur);
    const want=rm.total*frac;const step=want-rm.lastApplied;
    hero.position.x+=rm.dir.x*step;hero.position.z+=rm.dir.z*step;
    rm.lastApplied=want;
  }

  if(!hLocked&&moveTarget){
    const dx=moveTarget.x-hero.position.x, dz=moveTarget.z-hero.position.z;
    const d=Math.hypot(dx,dz);
    if(d>0.25){
      const dir=new THREE.Vector3(dx,0,dz).normalize();
      const far=d>5;
      const spd=far?HERO_SPEED.run:HERO_SPEED.walk;
      hero.position.x+=dir.x*spd*dt;
      hero.position.z+=dir.z*spd*dt;
      heroFacing=Math.atan2(dir.x,dir.z);
      const want=HSTATE.run;
      if(hCurrentName!==want)hPlay(want,{fade:0.12,speed:1.7});
    }else{
      moveTarget=null;
      hPlay(HSTATE.idle,{fade:0.25});
    }
  }else if(!hLocked && !moveTarget && hCurrentName!==HSTATE.idle){
    hPlay(HSTATE.idle,{fade:0.25});
  }
  // smooth turn
  let df=heroFacing-hero.rotation.y;
  while(df>Math.PI)df-=Math.PI*2;while(df<-Math.PI)df+=Math.PI*2;
  hero.rotation.y+=df*Math.min(1,dt*12);
  // push hero out of solid obstacles (trees/rocks)
  if(typeof resolveObstacle==='function'){
    const rr=resolveObstacle(hero.position.x,hero.position.z,HERO_RADIUS);
    hero.position.x=rr.x; hero.position.z=rr.z;
  }
  // terrain grounding: hero base sits on terrain height, feet refine
  if(!slam) hero.position.y=H(hero.position.x,hero.position.z);
  if(heroBar){heroBar.position.set(hero.position.x,hero.position.y+heroBarY,hero.position.z);}
  if(hmixer)hmixer.update(dt);
}

const enemies=[];

function makeHealthBar(){
  const cv=document.createElement('canvas');cv.width=180;cv.height=20;
  const tex=new THREE.CanvasTexture(cv);
  tex.minFilter=THREE.LinearFilter;
  const mat=new THREE.SpriteMaterial({map:tex,depthTest:false,depthWrite:false,transparent:true});
  const spr=new THREE.Sprite(mat);spr.scale.set(1.7,0.19,1);
  spr.userData={cv,ctx:cv.getContext('2d'),tex,ghost:1};
  return spr;
}
function rr(ctx,x,y,w,h,r){ // rounded rect
  r=Math.min(r,h/2,w/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawHealthBar(spr,frac,isElite,green){
  const {cv,ctx,tex}=spr.userData;
  frac=Math.max(0,Math.min(1,frac));
  const W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  // dark rounded pill background
  ctx.fillStyle='rgba(12,14,16,.88)';
  rr(ctx,0.5,0.5,W-1,H-1,H/2);ctx.fill();
  ctx.lineWidth=1.5;
  ctx.strokeStyle=isElite?'rgba(240,196,84,.9)':'rgba(0,0,0,.6)';
  rr(ctx,0.5,0.5,W-1,H-1,H/2);ctx.stroke();
  const pad=3, innerW=W-pad*2, innerH=H-pad*2;
  ctx.fillStyle='rgba(0,0,0,.45)';
  rr(ctx,pad,pad,innerW,innerH,innerH/2);ctx.fill();
  // ghost trail
  if(spr.userData.ghost==null)spr.userData.ghost=frac;
  if(spr.userData.ghost>frac)spr.userData.ghost+=(frac-spr.userData.ghost)*0.12; else spr.userData.ghost=frac;
  if(spr.userData.ghost>frac+0.001){
    ctx.fillStyle='rgba(200,200,200,.3)';
    rr(ctx,pad,pad,innerW*spr.userData.ghost,innerH,innerH/2);ctx.fill();
  }
  const fw=Math.max(0,innerW*frac);
  if(fw>0){
    const g=ctx.createLinearGradient(0,pad,0,pad+innerH);
    if(green){g.addColorStop(0,'#7ed957');g.addColorStop(0.5,'#4fb030');g.addColorStop(1,'#3a8a26');}
    else {g.addColorStop(0,'#e85a4a');g.addColorStop(0.5,'#cc2f22');g.addColorStop(1,'#a01c14');}
    ctx.fillStyle=g;
    rr(ctx,pad,pad,fw,innerH,innerH/2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.25)';
    rr(ctx,pad+1,pad+1,Math.max(0,fw-2),innerH*0.4,innerH/3);ctx.fill();
  }
  tex.needsUpdate=true;
}

// --- minimal SkeletonUtils.clone (inline, r128-compatible) ---
function cloneSkinned(source){
  const cloneLookup=new Map();
  const clone=source.clone(true);
  function parallel(a,b){
    cloneLookup.set(a,b);
    const n=Math.min(a.children.length,b.children.length);
    for(let i=0;i<n;i++)parallel(a.children[i],b.children[i]);
  }
  parallel(source,clone);
  // build a name->bone map of the clone as a fallback for bones not found via lookup
  const cloneByName={};
  clone.traverse(o=>{if(o.isBone||o.isObject3D){if(o.name)cloneByName[o.name]=o;}});
  clone.traverse(node=>{
    if(node.isSkinnedMesh){
      // find the matching source skinned mesh
      let sourceMesh=null;
      cloneLookup.forEach((v,k)=>{ if(v===node)sourceMesh=k; });
      if(!sourceMesh||!sourceMesh.skeleton)return;
      const skeleton=sourceMesh.skeleton;
      const bones=skeleton.bones.map(b=> cloneLookup.get(b) || cloneByName[b.name] || b );
      node.bind(new THREE.Skeleton(bones,skeleton.boneInverses),node.bindMatrix);
    }
  });
  return clone;
}

const ENEMY_CLIP_MAP={ idle:'Idle', run:'Run', attack:'Attack', die:'Die' };
// ===== VAT CROWD ENEMY SYSTEM (GPU instanced animation) =====
const VAT_BASE='https://raw.githubusercontent.com/Graphic37/Katana/master/katana-pack/Enemy%20NPC/';
const VAT_MAX=400;                // max instances PER creature type
// Creature registry: each creature has its own VAT mesh, textures, clips, and instance attributes.
const CREATURES={};   // key -> {mesh, clips, attrs:{...}, count}
// Definition of which VAT files each creature loads
const CREATURE_DEFS={
  mutant: { hi:'vat_hi_v2.png', lo:'vat_lo_v2.png', diffuse:['diffuse0_v2.jpg','diffuse1_v2.jpg'], meta:'vat_meta_v2.json', twoTex:true },
  warrok: { hi:'warrok_hi_v1.png', lo:'warrok_lo_v1.png', diffuse:['warrok_diffuse_v1.jpg'], meta:'warrok_meta_v1.json', twoTex:false },
};

async function buildCreature(key){
  const def=CREATURE_DEFS[key];
  const meta=await fetch(VAT_BASE+def.meta).then(r=>{if(!r.ok)throw new Error(def.meta+' '+r.status);return r.json();});
  const TL=new THREE.TextureLoader();
  function lt(url,filter){return new Promise((res,rej)=>TL.load(url,t=>{t.minFilter=t.magFilter=filter;t.generateMipmaps=false;t.flipY=false;res(t);},undefined,rej));}
  const texPromises=[lt(VAT_BASE+def.hi,THREE.NearestFilter),lt(VAT_BASE+def.lo,THREE.NearestFilter)];
  for(const d of def.diffuse)texPromises.push(lt(VAT_BASE+d,THREE.LinearFilter));
  const tex=await Promise.all(texPromises);
  const hi=tex[0],lo=tex[1],d0=tex[2],d1=def.twoTex?tex[3]:tex[2];

  const V=meta.V, TF=meta.TF, B=meta.boundary;
  const uvs=new Float32Array(meta.uvs);
  const vertexId=new Float32Array(V), matId=new Float32Array(V);
  for(let i=0;i<V;i++){vertexId[i]=i;matId[i]=i<B?0:1;}
  const inst=new THREE.InstancedBufferGeometry();
  inst.setIndex(meta.indices);
  inst.setAttribute('position',new THREE.BufferAttribute(new Float32Array(V*3),3));
  inst.setAttribute('uv',new THREE.BufferAttribute(uvs,2));
  inst.setAttribute('vertexId',new THREE.BufferAttribute(vertexId,1));
  inst.setAttribute('matId',new THREE.BufferAttribute(matId,1));
  const A={
    offset:new THREE.InstancedBufferAttribute(new Float32Array(VAT_MAX*3),3),
    frame:new THREE.InstancedBufferAttribute(new Float32Array(VAT_MAX),1),
    frameNext:new THREE.InstancedBufferAttribute(new Float32Array(VAT_MAX),1),
    frameMix:new THREE.InstancedBufferAttribute(new Float32Array(VAT_MAX),1),
    rot:new THREE.InstancedBufferAttribute(new Float32Array(VAT_MAX),1),
    scale:new THREE.InstancedBufferAttribute(new Float32Array(VAT_MAX),1),
    visible:new THREE.InstancedBufferAttribute(new Float32Array(VAT_MAX),1),
  };
  for(const k in A)A[k].setUsage(THREE.DynamicDrawUsage);
  inst.setAttribute('iOffset',A.offset);
  inst.setAttribute('iFrame',A.frame);
  inst.setAttribute('iFrameNext',A.frameNext);
  inst.setAttribute('iFrameMix',A.frameMix);
  inst.setAttribute('iRot',A.rot);
  inst.setAttribute('iScale',A.scale);
  inst.setAttribute('iVisible',A.visible);
  inst.instanceCount=0;
  const mat=new THREE.ShaderMaterial({uniforms:{
      vatHi:{value:hi},vatLo:{value:lo},d0:{value:d0},d1:{value:d1},
      texW:{value:V},texH:{value:TF},
      pmin:{value:new THREE.Vector3(meta.min[0],meta.min[1],meta.min[2])},
      pmax:{value:new THREE.Vector3(meta.max[0],meta.max[1],meta.max[2])},
      fogColor:{value:scene.fog?scene.fog.color:new THREE.Color(0x14181f)},
      fogNear:{value:scene.fog?scene.fog.near:60},fogFar:{value:scene.fog?scene.fog.far:160}},
    vertexShader:`
      attribute float vertexId; attribute float matId;
      attribute vec3 iOffset; attribute float iFrame; attribute float iFrameNext; attribute float iFrameMix; attribute float iRot; attribute float iScale; attribute float iVisible;
      uniform sampler2D vatHi; uniform sampler2D vatLo; uniform float texW; uniform float texH;
      uniform vec3 pmin; uniform vec3 pmax;
      varying vec2 vUv; varying float vMat; varying float vFog;
      vec3 sampleFrame(float fr){
        vec2 uvVat=vec2((vertexId+0.5)/texW,(fr+0.5)/texH);
        vec3 h=texture2D(vatHi,uvVat).rgb; vec3 l=texture2D(vatLo,uvVat).rgb;
        vec3 packed=(h*255.0*256.0+l*255.0)/65535.0;
        return mix(pmin,pmax,packed);
      }
      void main(){
        vUv=uv; vMat=matId;
        vec3 pA=sampleFrame(iFrame);
        vec3 pB=sampleFrame(iFrameNext);
        vec3 pos=mix(pA,pB,iFrameMix)*iScale;
        float s=sin(iRot), c=cos(iRot);
        vec3 rp=vec3(c*pos.x+s*pos.z, pos.y, -s*pos.x+c*pos.z);
        vec3 world=rp+iOffset;
        if(iVisible<0.5){ gl_Position=vec4(2.0,2.0,2.0,1.0); return; }
        vec4 mv=modelViewMatrix*vec4(world,1.0);
        vFog=(-mv.z);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      uniform sampler2D d0; uniform sampler2D d1;
      uniform vec3 fogColor; uniform float fogNear; uniform float fogFar;
      varying vec2 vUv; varying float vMat; varying float vFog;
      void main(){
        vec4 col = vMat<0.5 ? texture2D(d0,vUv) : texture2D(d1,vUv);
        float f=clamp((vFog-fogNear)/(fogFar-fogNear),0.0,1.0);
        gl_FragColor=vec4(mix(col.rgb,fogColor,f),1.0);
      }`
  });
  const mesh=new THREE.Mesh(inst,mat);
  mesh.frustumCulled=false;
  scene.add(mesh);
  const clips={};
  for(const c of meta.clips)clips[c.name]=c;
  CREATURES[key]={mesh,clips,A,count:0,modelHeight:(meta.max[1]-meta.min[1])};
}

async function loadEnemyAssets(){
  await Promise.all(Object.keys(CREATURE_DEFS).map(buildCreature));
}

// spawnEnemy: pick the creature for this type, allocate a slot in its instanced mesh
function spawnEnemy(typeKey,x,z,isElite){
  const t=ENEMY_TYPES[typeKey];
  const creatureKey=t.creature||'mutant';
  const C=CREATURES[creatureKey];
  if(!C)return null;
  const slot=C.count++;
  if(slot>=VAT_MAX){C.count=VAT_MAX;return null;}
  const eliteMul=isElite?1.5:1;
  const scale=(t.scale*eliteMul)/(C.modelHeight||1.5);
  const group=new THREE.Object3D();
  group.position.set(x,H(x,z),z);
  group.rotation.y=Math.random()*Math.PI*2;
  const idle=C.clips['Idle'];
  C.A.offset.array[slot*3]=x; C.A.offset.array[slot*3+1]=H(x,z); C.A.offset.array[slot*3+2]=z;
  C.A.rot.array[slot]=group.rotation.y;
  C.A.scale.array[slot]=scale;
  C.A.visible.array[slot]=1;
  C.A.frame.array[slot]=idle.start;
  C.A.frameNext.array[slot]=idle.start;
  C.A.frameMix.array[slot]=0;
  const bar=makeHealthBar(); bar.visible=false;
  if(isElite)bar.scale.set(2.1,0.24,1);
  scene.add(bar);
  const maxhp=t.hp*(isElite?3:1);
  const headWorldY=t.scale*eliteMul;
  const e={
    type:typeKey,creature:creatureKey,group,bar,slot,isElite:!!isElite,
    hp:maxhp,maxhp,dmg:t.dmg*(isElite?1.6:1),speed:t.speed,
    radius:isElite?2.2:1.6, scale,
    barY:headWorldY+0.6,
    dead:false,hitFlash:0,respawnT:0,
    state:'dormant',
    pack:null,attackCD:0,animTick:0,
    clip:'Idle', clipT:Math.random()*idle.frames, clipLoop:true,
    x,z,hy:0
  };
  enemies.push(e);
  return e;
}

function enemyAnim(e,name,loop=true,fade=0.15){
  const map={'Idle_ver_A':'Idle','Run_ver_B':'Run','Attack_3Combo_1_Inplace':'Attack','Damage_Die':'Die','Damage_Front_Big_ver_A':'Idle'};
  name=map[name]||name;
  if(e.clip===name)return;
  const C=CREATURES[e.creature];
  if(!C||!C.clips[name])return;
  e.clip=name; e.clipT=0; e.clipLoop=loop;
}

function vatUpdateEnemy(e,dt,fullRate){
  const C=CREATURES[e.creature]; if(!C)return;
  const clip=C.clips[e.clip]; if(!clip)return;
  if(fullRate!==0){
    e.clipT += dt*clip.fps*(fullRate||1);
    if(e.clipT>=clip.frames){
      if(e.clipLoop)e.clipT-=clip.frames;
      else e.clipT=clip.frames-1;
    }
  }
  const slot=e.slot, A=C.A;
  const fi=Math.floor(e.clipT);
  const mix=e.clipT-fi;
  let next; if(fi+1<clip.frames) next=fi+1; else next=e.clipLoop?0:fi;
  A.frame.array[slot]=clip.start+fi;
  A.frameNext.array[slot]=clip.start+next;
  A.frameMix.array[slot]=mix;
  A.offset.array[slot*3]=e.group.position.x;
  A.offset.array[slot*3+1]=e.group.position.y;
  A.offset.array[slot*3+2]=e.group.position.z;
  A.rot.array[slot]=e.group.rotation.y;
  A.visible.array[slot]=(e.dead && e.deadHidden)?0:1;
}
function vatFlushAttributes(){
  for(const key in CREATURES){
    const C=CREATURES[key];
    C.A.frame.needsUpdate=true;C.A.frameNext.needsUpdate=true;C.A.frameMix.needsUpdate=true;
    C.A.offset.needsUpdate=true;C.A.rot.needsUpdate=true;C.A.visible.needsUpdate=true;
    C.mesh.geometry.instanceCount=C.count;
  }
}


// --- packs: groups placed around the field, dormant until hero is near ---
const packs=[];
function spawnPacks(){
  const PACK_SPOTS=[
    [0,-40],[35,-25],[-38,-20],[30,30],[-30,35],[50,-50],[-55,-45],[10,55],[-15,-60],[60,10],
    [-60,55],[70,-15],[-70,-10],[20,70],[-25,-75],[80,40]
  ];
  PACK_SPOTS.forEach(([cx,cz],i)=>{
    const pack={id:i,members:[],awake:false,cx,cz};
    const count=6+Math.floor(Math.random()*6);          // 6-11 per pack (bigger swarms)
    for(let j=0;j<count;j++){
      const a=Math.random()*Math.PI*2,r=Math.random()*7;
      const x=cx+Math.cos(a)*r, z=cz+Math.sin(a)*r;
      const isElite=(j===0&&Math.random()<0.5);
      // type mix: mostly grunts, some brutes, occasional warrok (bigger/tougher)
      const roll=Math.random();
      const type = roll<0.6 ? 'grunt' : (roll<0.85 ? 'brute' : 'warrok');
      const e=spawnEnemy(type,x,z,isElite);
      if(e){e.pack=pack;pack.members.push(e);}
    }
    packs.push(pack);
  });
}

const AGGRO_RADIUS=26;       // pack wakes when hero gets this close
const MAX_ATTACKERS=14;      // bigger swarms can attack now (VAT handles the count)
const ANIM_LOD_NEAR=22, ANIM_LOD_MID=42; // tighter: fewer enemies at full anim rate

function nearestEnemy(maxDist){
  let best=null,bd=maxDist;
  for(const e of enemies){
    if(e.dead)continue;
    const d=Math.hypot(e.group.position.x-hero.position.x,e.group.position.z-hero.position.z);
    if(d<bd){bd=d;best=e;}
  }
  return best?{e:best,d:bd}:null;
}

function updateEnemies(dt){
  // wake packs whose leader/any member is within aggro radius
  for(const pack of packs){
    if(pack.awake)continue;
    for(const e of pack.members){
      if(e.dead)continue;
      const d=Math.hypot(e.x-hero.position.x,e.z-hero.position.z);
      if(d<AGGRO_RADIUS){pack.awake=true;break;}
    }
    if(pack.awake){for(const e of pack.members){if(!e.dead&&e.state==='dormant')e.state='chase';}}
  }

  // count current attackers (for the cap)
  let attackers=0;
  for(const e of enemies){if(!e.dead&&e.state==='attack')attackers++;}

  for(const e of enemies){
    // ---- animation LOD: throttle VAT frame advance by distance ----
    const ddx=e.group.position.x-hero.position.x, ddz=e.group.position.z-hero.position.z;
    const d2=ddx*ddx+ddz*ddz;
    let animRate=1;
    if(d2>ANIM_LOD_MID*ANIM_LOD_MID){
      e.animTick=(e.animTick+1)%6; animRate=(e.animTick===0)?6:0;
    }else if(d2>ANIM_LOD_NEAR*ANIM_LOD_NEAR){
      e.animTick=(e.animTick+1)%3; animRate=(e.animTick===0)?3:0;
    }
    e._animRate=animRate;

    if(e.dead){
      e.respawnT-=dt;
      vatUpdateEnemy(e,dt,e._animRate);  // advance death animation (holds last frame)
      continue;
    }

    const dist=Math.sqrt(d2);

    // grabbed-by-slam or carried-by-charge: position driven elsewhere, but still sync the instance
    if(slam&&slam.grabbed&&slam.target===e&&!slam.dmgDone){ vatUpdateEnemy(e,dt,e._animRate); continue; }
    if(charge&&charge.carried.includes(e)&&!charge.slammed){ vatUpdateEnemy(e,dt,e._animRate); continue; }

    // hit flash shake
    if(e.hitFlash>0){e.hitFlash-=dt;}

    if(e.state==='dormant'){
      enemyAnim(e,'Idle_ver_A');
    } else if(e.state==='chase'){
      enemyAnim(e,'Run_ver_B',true,0.2);
      // move toward hero
      if(dist>ATTACK_RANGE*0.9){
        const inv=1/(dist||1);
        e.x+=(-ddx*inv)*e.speed*dt; e.z+=(-ddz*inv)*e.speed*dt;
        e.group.rotation.y=Math.atan2(-ddx,-ddz);
      } else if(attackers<MAX_ATTACKERS){
        e.state='attack'; attackers++;
        e.attackCD=0;
      }
    } else if(e.state==='attack'){
      e.group.rotation.y=Math.atan2(-ddx,-ddz);
      if(dist>ATTACK_RANGE*1.3){ e.state='chase'; }
      else{
        e.attackCD-=dt;
        if(e.attackCD<=0){
          enemyAnim(e,'Attack_3Combo_1_Inplace',false,0.08);
          e.attackCD=1.1+Math.random()*0.5;
          // deal damage to hero partway through
          setTimeout(()=>{ if(!e.dead && Math.hypot(e.x-hero.position.x,e.z-hero.position.z)<ATTACK_RANGE*1.4) damageHero(e.dmg); },300);
        } else if(e.clip==='Attack' && e.clipT>=vatClips['Attack'].frames-1){
          enemyAnim(e,'Idle_ver_A',true,0.2);
        }
      }
    }

    // ground + apply position
    e.hy=H(e.x,e.z);
    // push enemy out of solid obstacles
    if(typeof resolveObstacle==='function'){
      const rr=resolveObstacle(e.x,e.z,e.radius);
      e.x=rr.x; e.z=rr.z;
    }
    let sx=0,sz=0;
    if(e.hitFlash>0){const k=e.hitFlash/0.12;sx=(Math.random()-0.5)*0.18*k;sz=(Math.random()-0.5)*0.18*k;}
    e.group.position.set(e.x+sx,e.hy,e.z+sz);
    // write this enemy's transform + advance its animation into the instanced mesh
    vatUpdateEnemy(e,dt,e._animRate);
    // health bar visible only when damaged and alive
    if(e.bar){
      e.bar.visible=(!e.dead && e.hp<e.maxhp);
      e.bar.position.set(e.x, e.hy+e.barY, e.z);
    }
  }
  vatFlushAttributes();
  resolveCollisions(dt);
}

// separation: enemies push apart from each other and out of the hero (no clumping/overlap)
const HERO_RADIUS=2.4;
function packMemberAlive(pack){return pack.members.some(m=>!m.dead);}
function resolveCollisions(dt){
  const live=enemies.filter(e=>!e.dead && !(slam&&slam.grabbed&&slam.target===e) && !(charge&&charge.carried.includes(e)&&!charge.slammed));
  // enemy <-> enemy
  for(let i=0;i<live.length;i++){
    const a=live[i];
    for(let j=i+1;j<live.length;j++){
      const b=live[j];
      let dx=b.x-a.x, dz=b.z-a.z;
      let d=Math.hypot(dx,dz);
      const minD=a.radius+b.radius;
      if(d<minD && d>0.0001){
        const push=(minD-d)*0.5;
        dx/=d; dz/=d;
        a.x-=dx*push; a.z-=dz*push;
        b.x+=dx*push; b.z+=dz*push;
      } else if(d<=0.0001){
        a.x+=(Math.random()-0.5)*0.1; b.x-=(Math.random()-0.5)*0.1;
      }
    }
    // enemy <-> hero: push the HERO out, enemies hold their ground (no bulldozing)
    let hx=a.x-hero.position.x, hz=a.z-hero.position.z;
    let hd=Math.hypot(hx,hz);
    const minH=a.radius+HERO_RADIUS;
    if(hd<minH && hd>0.0001){
      hx/=hd; hz/=hd;
      // move the hero back out of the enemy (not the enemy)
      const overlap=minH-hd;
      // don't fight an active lunge/dash — only nudge during normal contact
      if(!(hLocked&&lunge&&lunge.remaining>0) && !dodge){
        hero.position.x-=hx*overlap;
        hero.position.z-=hz*overlap;
      }
    }
    // commit position
    a.group.position.x=a.x; a.group.position.z=a.z; a.group.position.y=H(a.x,a.z);
  }
}

// damage dealt TO an enemy (called by hero attacks)
function damageTarget(e,amount){
  if(!e||e.dead||distTo(e)>MELEE_RANGE+1.5){
    let best=null,bd=MELEE_RANGE+1.5;
    for(const en of enemies){if(en.dead)continue;const d=distTo(en);if(d<bd){bd=d;best=en;}}
    e=best;
  }
  if(!e||e.dead)return;
  applyEnemyDamage(e,amount);
}
// AoE: hit ALL living enemies within radius of a world point (default: hero)
function damageAoE(amount,radius,cx,cz){
  cx=cx==null?hero.position.x:cx; cz=cz==null?hero.position.z:cz;
  let hitCount=0;
  for(const e of enemies){
    if(e.dead)continue;
    const d=Math.hypot(e.group.position.x-cx,e.group.position.z-cz);
    if(d<=radius){applyEnemyDamage(e,amount);hitCount++;}
  }
  return hitCount;
}
function applyEnemyDamage(e,amount){
  e.hp-=amount;e.hitFlash=0.12;
  // hit VFX at enemy chest height
  const hy=e.hy+e.barY*0.55;
  if(typeof spawnSparks==='function'){
    spawnSparks(e.x,hy,e.z, e.isElite?0xffc040:0xff7050, amount>=100?12:6);
    spawnHitFlash(e.x,hy,e.z, 0xfff0d0);
  }
  // hit SFX — heavy for big hits, normal otherwise; throttle so AoE doesn't spam
  if(typeof SFX!=='undefined'){
    const now=performance.now();
    if(!applyEnemyDamage._lastHit || now-applyEnemyDamage._lastHit>40){
      applyEnemyDamage._lastHit=now;
      if(amount>=100)SFX.play('heavy',{vol:0.6});
      else SFX.play('hit',{vol:0.5});
    }
    if(Math.random()<0.5)SFX.play('enemyhurt',{vol:0.45});
  }
  if(e.state==='dormant'){e.state='chase';if(e.pack)e.pack.awake=true;}
  drawHealthBar(e.bar,e.hp/e.maxhp,e.isElite);
  if(e.hp<=0 && !e.dead){
    e.dead=true;e.respawnT=999;
    if(e.bar)e.bar.visible=false;        // hide bar instantly on death
    if(typeof SFX!=='undefined')SFX.play('enemyhurt',{vol:0.6,rate:0.9}); // death cry
    enemyAnim(e,'Damage_Die',false,0.1);
    // DROP LOOT BEAM (elites/brutes drop better)
    const eliteBonus = e.isElite || e.type==='brute';
    const dropChance = e.isElite ? 1.0 : (e.type==='brute' ? 0.45 : 0.18);
    if(Math.random()<dropChance){
      const rarity=rollRarity(eliteBonus);
      spawnLootBeam(e.x, e.z, rarity);
    }
    // hide the instance after the death animation finishes playing
    setTimeout(()=>{ e.deadHidden=true; const C=CREATURES[e.creature]; if(C){C.A.visible.array[e.slot]=0;C.A.visible.needsUpdate=true;} },1600);
  }
}

// ===== LOOT BEAMS =====
const lootBeams=[];
const RARITY={
  common:   {color:0xeef2f6, core:0xffffff, chance:0.55, h:7.0, r:0.12},
  magic:    {color:0x3d7bff, core:0xbfd4ff, chance:0.25, h:8.0, r:0.13},
  rare:     {color:0xffc41f, core:0xfff3b0, chance:0.13, h:9.0, r:0.15},
  epic:     {color:0xc04dff, core:0xe9c0ff, chance:0.055,h:10.0,r:0.17},
  legendary:{color:0xff6a00, core:0xffd070, chance:0.015,h:12.0,r:0.20},
};
function rollRarity(eliteBonus){
  let x=Math.random();
  if(eliteBonus && Math.random()<0.5) x*=0.3;
  let cum=0;
  for(const k of ['common','magic','rare','epic','legendary']){
    cum+=RARITY[k].chance;
    if(x<=cum)return k;
  }
  return 'common';
}
function spawnLootBeam(x,z,rarity){
  const R=RARITY[rarity]||RARITY.common;
  const gy=H(x,z);
  const group=new THREE.Group();
  group.position.set(x,gy,z);

  // SOLID outer glow shaft — renders ON TOP of world (depthTest false) so grass can't bury it
  const glowGeo=new THREE.CylinderGeometry(R.r*2.2,R.r*2.6,R.h,18,1,true);
  const glowMat=new THREE.MeshBasicMaterial({color:R.color,transparent:true,opacity:0.22,
    side:THREE.DoubleSide,depthTest:false,depthWrite:false,blending:THREE.AdditiveBlending});
  const glow=new THREE.Mesh(glowGeo,glowMat);glow.position.y=R.h/2;glow.renderOrder=999;group.add(glow);

  // mid shaft — solid colored, bright, on top
  const midGeo=new THREE.CylinderGeometry(R.r,R.r*1.2,R.h,16,1,true);
  const midMat=new THREE.MeshBasicMaterial({color:R.color,transparent:true,opacity:0.85,
    side:THREE.DoubleSide,depthTest:false,depthWrite:false});
  const mid=new THREE.Mesh(midGeo,midMat);mid.position.y=R.h/2;mid.renderOrder=1000;group.add(mid);

  // bright white-hot core — the solid center that reads from far away
  const coreGeo=new THREE.CylinderGeometry(R.r*0.45,R.r*0.5,R.h,12,1,true);
  const coreMat=new THREE.MeshBasicMaterial({color:R.core,transparent:true,opacity:0.95,
    side:THREE.DoubleSide,depthTest:false,depthWrite:false});
  const core=new THREE.Mesh(coreGeo,coreMat);core.position.y=R.h/2;core.renderOrder=1001;group.add(core);

  // ground burst disc (on top of grass)
  const discGeo=new THREE.CircleGeometry(R.r*5,28);
  const discMat=new THREE.MeshBasicMaterial({color:R.color,transparent:true,opacity:0.5,
    depthTest:false,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
  const disc=new THREE.Mesh(discGeo,discMat);disc.rotation.x=-Math.PI/2;disc.position.y=0.06;disc.renderOrder=998;group.add(disc);

  // a few rising sparkle motes (also on top)
  const motes=[];
  const moteCount=rarity==='common'?5:(rarity==='legendary'?16:9);
  for(let i=0;i<moteCount;i++){
    const mg=new THREE.SphereGeometry(0.08+Math.random()*0.06,6,6);
    const mm=new THREE.MeshBasicMaterial({color:R.core,transparent:true,opacity:1,
      depthTest:false,depthWrite:false,blending:THREE.AdditiveBlending});
    const m=new THREE.Mesh(mg,mm);m.renderOrder=1002;
    const ang=Math.random()*Math.PI*2,rad=R.r*(1.0+Math.random()*2.5);
    m.userData={ang,rad,yo:Math.random()*R.h,spd:1.2+Math.random()*1.4};
    group.add(m);motes.push(m);
  }

  scene.add(group);
  lootBeams.push({group,glow,mid,core,disc,motes,R,rarity,t:0,life:16,popT:0});
}
function updateLootBeams(dt){
  for(let i=lootBeams.length-1;i>=0;i--){
    const L=lootBeams[i];L.t+=dt;
    // pop-in: shoot up quickly
    if(L.popT<1){L.popT=Math.min(1,L.popT+dt*5);const s=L.popT;L.group.scale.set(1,s,1);}
    // subtle pulse on the glow + disc only (keep core solid & readable)
    const pulse=0.85+Math.sin(L.t*4)*0.15;
    L.glow.material.opacity=0.22*pulse;
    L.disc.material.opacity=0.45*(0.75+Math.sin(L.t*2.5)*0.25);
    L.disc.scale.setScalar(1+Math.sin(L.t*2.5)*0.08);
    L.disc.rotation.z+=dt*0.8;
    // rising motes
    for(const m of L.motes){
      m.userData.yo+=m.userData.spd*dt;
      if(m.userData.yo>L.R.h)m.userData.yo=0;
      const fade=1-(m.userData.yo/L.R.h);
      m.position.set(Math.cos(m.userData.ang+L.t*0.6)*m.userData.rad, m.userData.yo, Math.sin(m.userData.ang+L.t*0.6)*m.userData.rad);
      m.material.opacity=fade;
    }
    // fade out at end
    if(L.t>L.life-1.5){
      const f=Math.max(0,(L.life-L.t)/1.5);
      L.glow.material.opacity*=f;L.mid.material.opacity=0.85*f;L.core.material.opacity=0.95*f;
      L.disc.material.opacity*=f;L.motes.forEach(m=>m.material.opacity*=f);
    }
    if(L.t>=L.life){
      scene.remove(L.group);
      L.group.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});
      lootBeams.splice(i,1);
    }
  }
}

// ===== VFX SYSTEM =====
const vfx=[];
function spawnShockwave(x,z,color,maxR,life){
  const geo=new THREE.RingGeometry(0.3,0.6,40);
  const mat=new THREE.MeshBasicMaterial({color:color||0xffffff,transparent:true,opacity:0.8,side:THREE.DoubleSide,depthWrite:false});
  const ring=new THREE.Mesh(geo,mat);
  ring.rotation.x=-Math.PI/2;
  ring.position.set(x,H(x,z)+0.15,z);
  scene.add(ring);
  vfx.push({type:'ring',mesh:ring,mat,t:0,life:life||0.5,maxR:maxR||8});
}
function spawnSparks(x,y,z,color,n){
  for(let i=0;i<(n||8);i++){
    const geo=new THREE.SphereGeometry(0.12,5,5);
    const mat=new THREE.MeshBasicMaterial({color:color||0xffd060,transparent:true,opacity:1,depthWrite:false});
    const s=new THREE.Mesh(geo,mat);
    s.position.set(x,y,z);
    const a=Math.random()*Math.PI*2, up=2+Math.random()*3, out=3+Math.random()*4;
    scene.add(s);
    vfx.push({type:'spark',mesh:s,mat,t:0,life:0.4+Math.random()*0.2,
      vx:Math.cos(a)*out,vy:up,vz:Math.sin(a)*out});
  }
}
function spawnHitFlash(x,y,z,color){
  const geo=new THREE.SphereGeometry(0.6,8,8);
  const mat=new THREE.MeshBasicMaterial({color:color||0xffffff,transparent:true,opacity:0.9,depthWrite:false,blending:THREE.AdditiveBlending});
  const f=new THREE.Mesh(geo,mat);f.position.set(x,y,z);scene.add(f);
  vfx.push({type:'flash',mesh:f,mat,t:0,life:0.18});
}
function updateVFX(dt){
  for(let i=vfx.length-1;i>=0;i--){
    const v=vfx[i];v.t+=dt;const k=v.t/v.life;
    if(k>=1){scene.remove(v.mesh);v.mesh.geometry.dispose();v.mat.dispose();vfx.splice(i,1);continue;}
    if(v.type==='ring'){
      const r=0.6+k*v.maxR;v.mesh.scale.set(r,r,r);v.mat.opacity=0.8*(1-k);
    }else if(v.type==='spark'){
      v.vy-=14*dt;
      v.mesh.position.x+=v.vx*dt;v.mesh.position.y+=v.vy*dt;v.mesh.position.z+=v.vz*dt;
      v.mat.opacity=1-k;
    }else if(v.type==='flash'){
      const s=1+k*1.5;v.mesh.scale.set(s,s,s);v.mat.opacity=0.9*(1-k);
    }
  }
}

const clock=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);
  WIND.uTime.value += dt;
  updateHero(dt);
  updateSlam(dt);
  updateCharge(dt);
  updateDodge(dt);
  if(heroIFrames>0)heroIFrames-=dt;
  updateEnemies(dt);
  updateVFX(dt);
  updateLootBeams(dt);
  updateCamera(dt);
  renderer.render(scene,camera);
})();
</script>
